<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Live Rasengan</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

#camera {
    display: none;
}

#output {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    transform: scaleX(-1);
}

#start {
    position: fixed;
    z-index: 20;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);

    padding: 18px 30px;
    border: none;
    border-radius: 15px;

    background: #168cff;
    color: white;
    font-size: 20px;
    font-weight: bold;

    box-shadow: 0 0 30px #168cff;
}

#status {
    position: fixed;
    z-index: 10;
    top: 15px;
    left: 50%;
    transform: translateX(-50%);

    color: white;
    background: rgba(0,0,0,.55);
    padding: 8px 15px;
    border-radius: 20px;

    font-size: 14px;
}
</style>
</head>

<body>

<video id="camera" autoplay playsinline></video>
<canvas id="output"></canvas>

<div id="status">Press START and show your hand ✋</div>

<button id="start">START RASENGAN 🔵</button>

<audio id="rasenganSound" preload="auto">
    <source src="rasengan.mp3" type="audio/mpeg">
</audio>

<script>

const video = document.getElementById("camera");
const canvas = document.getElementById("output");
const ctx = canvas.getContext("2d");

const startButton = document.getElementById("start");
const statusText = document.getElementById("status");
const sound = document.getElementById("rasenganSound");

let running = false;
let handX = null;
let handY = null;

let particles = [];
let rotation = 0;
let lastSoundTime = 0;


/* -----------------------------
   RESIZE
----------------------------- */

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

window.addEventListener("resize", resize);
resize();


/* -----------------------------
   PARTICLES
----------------------------- */

function createParticles(x, y, radius) {

    for (let i = 0; i < 4; i++) {

        const angle = Math.random() * Math.PI * 2;
        const r = radius * (0.5 + Math.random() * 0.8);

        particles.push({
            x: x + Math.cos(angle) * r,
            y: y + Math.sin(angle) * r,

            vx: Math.cos(angle) * (1 + Math.random() * 3),
            vy: Math.sin(angle) * (1 + Math.random() * 3),

            life: 1,
            size: 1 + Math.random() * 4
        });
    }
}


/* -----------------------------
   DRAW PARTICLES
----------------------------- */

function drawParticles() {

    for (let i = particles.length - 1; i >= 0; i--) {

        const p = particles[i];

        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.025;

        if (p.life <= 0) {
            particles.splice(i, 1);
            continue;
        }

        ctx.beginPath();

        ctx.fillStyle =
            `rgba(120,210,255,${p.life})`;

        ctx.shadowBlur = 15;
        ctx.shadowColor = "#00aaff";

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    ctx.shadowBlur = 0;
}


/* -----------------------------
   RASENGAN
----------------------------- */

function drawRasengan(x, y, radius) {

    rotation += 0.13;

    createParticles(x, y, radius);


    /* BIG GLOW */

    const glow = ctx.createRadialGradient(
        x, y, 0,
        x, y, radius * 1.8
    );

    glow.addColorStop(0, "rgba(255,255,255,1)");
    glow.addColorStop(.15, "rgba(120,220,255,.95)");
    glow.addColorStop(.45, "rgba(0,130,255,.65)");
    glow.addColorStop(1, "rgba(0,80,255,0)");

    ctx.fillStyle = glow;

    ctx.beginPath();
    ctx.arc(x, y, radius * 1.8, 0, Math.PI * 2);
    ctx.fill();


    /* ENERGY BALL */

    const ball = ctx.createRadialGradient(
        x - radius * .3,
        y - radius * .3,
        radius * .05,

        x,
        y,
        radius
    );

    ball.addColorStop(0, "#ffffff");
    ball.addColorStop(.18, "#bdeeff");
    ball.addColorStop(.45, "#36baff");
    ball.addColorStop(.75, "#087cff");
    ball.addColorStop(1, "#003bff");

    ctx.fillStyle = ball;

    ctx.shadowBlur = 35;
    ctx.shadowColor = "#00aaff";

    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.fill();

    ctx.shadowBlur = 0;


    /* SPIRAL ENERGY */

    ctx.save();

    ctx.translate(x, y);
    ctx.rotate(rotation);

    for (let i = 0; i < 18; i++) {

        const a = i * 0.7;
        const rr = radius * (0.15 + i / 25);

        ctx.beginPath();

        ctx.strokeStyle =
            `rgba(220,250,255,${0.35 + Math.random() * .5})`;

        ctx.lineWidth = 2 + Math.random() * 3;

        ctx.shadowBlur = 10;
        ctx.shadowColor = "#ffffff";

        ctx.arc(
            0,
            0,
            rr,
            a,
            a + Math.PI * .9
        );

        ctx.stroke();
    }

    ctx.restore();


    /* WHITE CORE */

    const core = ctx.createRadialGradient(
        x, y, 0,
        x, y, radius * .45
    );

    core.addColorStop(0, "rgba(255,255,255,1)");
    core.addColorStop(.4, "rgba(220,250,255,.9)");
    core.addColorStop(1, "rgba(100,200,255,0)");

    ctx.fillStyle = core;

    ctx.beginPath();
    ctx.arc(x, y, radius * .45, 0, Math.PI * 2);
    ctx.fill();
}


/* -----------------------------
   HAND TRACKING
----------------------------- */

const hands = new Hands({
    locateFile: (file) => {
        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
    }
});

hands.setOptions({

    maxNumHands: 2,

    modelComplexity: 1,

    minDetectionConfidence: 0.65,

    minTrackingConfidence: 0.65
});


hands.onResults(results => {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* CAMERA */

    ctx.save();

    ctx.translate(canvas.width, 0);
    ctx.scale(-1, 1);

    ctx.drawImage(
        results.image,
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.restore();


    if (!results.multiHandLandmarks ||
        results.multiHandLandmarks.length === 0) {

        handX = null;
        handY = null;

        statusText.innerText =
            "Show your palm ✋";

        return;
    }


    /* USE FIRST HAND */

    const landmarks =
        results.multiHandLandmarks[0];


    /*
       Landmark 9 = middle finger base.
       This gives a stable palm-center position.
    */

    const palm = landmarks[9];


    /*
       Mirror X because the camera is mirrored.
    */

    const x =
        (1 - palm.x) * canvas.width;

    const y =
        palm.y * canvas.height;


    handX = x;
    handY = y;


    /* DISTANCE BETWEEN WRIST AND MIDDLE FINGER */

    const wrist = landmarks[0];

    const dx = palm.x - wrist.x;
    const dy = palm.y - wrist.y;

    const distance =
        Math.sqrt(dx * dx + dy * dy);


    let radius =
        distance * canvas.height * 0.75;


    radius =
        Math.max(45, Math.min(130, radius));


    statusText.innerText =
        "RASENGAN READY 🔵";


    /* DRAW RASENGAN */

    drawRasengan(
        handX,
        handY,
        radius
    );


    drawParticles();
});


/* -----------------------------
   CAMERA
----------------------------- */

let camera;

async function startCamera() {

    try {

        camera = new Camera(video, {

            onFrame: async () => {

                await hands.send({
                    image: video
                });

            },

            width: 1280,
            height: 720

        });

        await camera.start();

        running = true;

        startButton.style.display = "none";

        statusText.innerText =
            "Show your palm ✋";

    } catch (error) {

        console.error(error);

        statusText.innerText =
            "Camera permission required 📷";

        alert(
            "Please allow camera permission and try again."
        );
    }
}


/* -----------------------------
   SOUND
----------------------------- */

startButton.addEventListener("click", async () => {

    /*
       Browser audio requires a user interaction.
    */

    try {

        sound.volume = 0.8;

        await sound.play();

        sound.pause();
        sound.currentTime = 0;

    } catch (e) {
        console.log("Audio permission:", e);
    }

    startCamera();
});


/*
   Play sound when hand is detected.

   A cooldown prevents the sound
   from restarting every frame.
*/

setInterval(() => {

    if (!running || handX === null)
        return;

    const now = Date.now();

    if (now - lastSoundTime > 2500) {

        sound.currentTime = 0;

        sound.play().catch(() => {});

        lastSoundTime = now;
    }

}, 300);


/* -----------------------------
   ANIMATION LOOP
----------------------------- */

function animate() {

    requestAnimationFrame(animate);

    if (handX !== null) {

        /*
           Extra energy particles.
        */

        drawParticles();
    }
}

animate();

</script>

</body>
</html>
